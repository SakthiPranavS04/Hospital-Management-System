<svg width="1600" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7b5cf0;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="200" fill="url(#grad1)"/>
  
  <!-- Hospital icons and text -->
  <g>
    <!-- Medical cross icon -->
    <circle cx="100" cy="100" r="40" fill="white" opacity="0.2"/>
    <rect x="80" y="90" width="40" height="20" fill="white" opacity="0.8"/>
    <rect x="90" y="80" width="20" height="40" fill="white" opacity="0.8"/>
    
    <!-- Heart icon -->
    <circle cx="1500" cy="100" r="40" fill="white" opacity="0.2"/>
    <path d="M1500 130 Q1470 100 1480 80 Q1490 70 1500 75 Q1510 70 1520 80 Q1530 100 1500 130" fill="white" opacity="0.8"/>
    
    <!-- Center text -->
    <text x="800" y="120" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">
      Welcome to MedCore Hospital Management System
    </text>
  </g>
</svg>
